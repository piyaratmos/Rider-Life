<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชีวิตไรเดอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#16231c;--mute:#6b7a72;--line:#e3e9e5;--g:#00a84a;--gs:#e2f6ea;--r:#e5484d;--rs:#fdeaea;--b:#1f6feb;--bs:#e6efff;--hero:#0b3d26}
@media(prefers-color-scheme:dark){:root{--bg:#0c1511;--card:#14201a;--ink:#e8f1ec;--mute:#8fa399;--line:#233229;--gs:#12331f;--rs:#3a1719;--bs:#14284a;--hero:#06271a}}
*{box-sizing:border-box;margin:0}
body{font-family:Prompt,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--hero);color:#fff;padding:22px 0 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:#00b14f;display:grid;place-items:center;font-size:22px}
h1{font-size:20px;font-weight:600}.sub{font-size:13px;opacity:.7}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:0}
.ib{background:#ffffff1f;color:#fff;padding:9px 12px;border-radius:12px;display:flex;gap:6px;align-items:center;font-size:13px}
.ib:hover{background:#ffffff33}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-48px}
.s{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.s small{color:var(--mute);font-size:12px;display:block}.s b{font-size:21px;font-weight:600}
.inc .ico{background:var(--gs);color:var(--g)}.inc b{color:var(--g)}
.exp .ico{background:var(--rs);color:var(--r)}.exp b{color:var(--r)}
.net .ico{background:var(--bs);color:var(--b)}.avg .ico{background:var(--bs);color:var(--b)}
.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h2{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{padding:9px;border-radius:9px;background:none;color:var(--mute);display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on.in{background:var(--g);color:#fff}.seg button.on.ex{background:var(--r);color:#fff}
label{font-size:12px;color:var(--mute);display:block;margin:8px 0 4px}
input,select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.save{width:100%;margin-top:14px;padding:12px;border-radius:12px;color:#fff;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t div{font-weight:500}.row .t small{color:var(--mute);font-size:12px}
.row .a{font-weight:600}.row .a.in{color:var(--g)}.row .a.ex{color:var(--r)}
.row .ico{width:38px;height:38px;font-size:18px}.row .ico.in{background:var(--gs);color:var(--g)}.row .ico.ex{background:var(--rs);color:var(--r)}
.del{background:none;color:var(--mute);padding:6px;border-radius:8px}.del:hover{color:var(--r);background:var(--rs)}
.list{max-height:420px;overflow:auto}
.ch{position:relative;height:250px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.bar select{width:auto}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--bs);color:var(--b);display:inline-flex;gap:6px;align-items:center}
.pill.ok{background:var(--gs);color:var(--g)}
dialog{border:0;border-radius:20px;padding:22px;max-width:480px;width:92%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog p{font-size:13px;color:var(--mute);margin:6px 0 10px;line-height:1.6}
.row2{display:flex;gap:8px;margin-top:12px}.row2 button{flex:1;padding:11px;border-radius:12px;background:var(--bg);color:var(--ink)}
.row2 .p{background:var(--g);color:#fff}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--bg);border:2px solid transparent;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink)}
.chips.in .chip.on{border-color:var(--g)}.chips.ex .chip.on{border-color:var(--r)}
.chip .ico{width:34px;height:34px;font-size:16px}
.lt{font-weight:700;font-size:15px;font-style:normal}
.row .ico.ex{background:var(--rs);color:var(--r)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
@media(max-width:820px){.stat{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.s b{font-size:18px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="car" viewBox="0 0 24 24"><path d="M5 17H3v-5l2-5h14l2 5v5h-2M5 17a2 2 0 1 0 4 0m6 0a2 2 0 1 0 4 0M9 17h6M3 12h18"/></symbol>
<symbol id="bike" viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="gift" viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></symbol>
<symbol id="up" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></symbol>
<symbol id="down" viewBox="0 0 24 24"><path d="m3 7 6 6 4-4 8 8M15 17h6v-6"/></symbol>
<symbol id="wallet" viewBox="0 0 24 24"><path d="M20 7H5a2 2 0 0 1 0-4h13v4zM3 5v14a2 2 0 0 0 2 2h15V7M16 14h2"/></symbol>
<symbol id="cal" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></symbol>
<symbol id="fuel" viewBox="0 0 24 24"><path d="M3 22V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v17M2 22h13M14 10h2a2 2 0 0 1 2 2v3a2 2 0 0 0 4 0V8l-3-3M6 8h6"/></symbol>
<symbol id="shirt" viewBox="0 0 24 24"><path d="M20 6 16 3a4 4 0 0 1-8 0L4 6l-2 4 4 2v9h12v-9l4-2z"/></symbol>
<symbol id="tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3 17.7 6.3 21l6.3-6.3a4 4 0 0 0 5.1-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></symbol>
<symbol id="food" viewBox="0 0 24 24"><path d="M7 2v8M4 2v5a3 3 0 0 0 6 0V2M7 10v12M18 22V2c-3 2-4 6-4 9h4"/></symbol>
<symbol id="dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
<symbol id="cloud" viewBox="0 0 24 24"><path d="M17.5 19a4.5 4.5 0 1 0-1-8.9A6 6 0 0 0 5 12a3.5 3.5 0 0 0 .5 7z"/></symbol>
<symbol id="pie" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9zM15 3.5A9 9 0 0 1 20.5 9H15z"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="chart" viewBox="0 0 24 24"><path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-9"/></symbol>
</defs></svg>

<header><div class="wrap top">
  <div class="brand"><div class="logo"><svg class="i"><use href="#bike"/></svg></div>
    <div><h1>ชีวิตไรเดอร์</h1><div class="sub">บันทึกรายรับ รายจ่าย และกำไรสุทธิ</div></div></div>
  <div class="btns"><button class="ib" id="syncBtn"><svg class="i"><use href="#cloud"/></svg><span id="syncTxt">ตั้งค่า Sheet</span></button></div>
</div></header>

<main class="wrap">
  <section class="stat">
    <div class="s inc"><div class="ico"><svg class="i"><use href="#up"/></svg></div><div><small>รายรับรวม</small><b id="sIn">0</b></div></div>
    <div class="s exp"><div class="ico"><svg class="i"><use href="#down"/></svg></div><div><small>รายจ่ายรวม</small><b id="sEx">0</b></div></div>
    <div class="s net"><div class="ico"><svg class="i"><use href="#wallet"/></svg></div><div><small>กำไรสุทธิ</small><b id="sNet">0</b></div></div>
    <div class="s avg"><div class="ico"><svg class="i"><use href="#cal"/></svg></div><div><small>กำไรเฉลี่ย/วัน</small><b id="sAvg">0</b></div></div>
  </section>

  <section class="grid">
    <div class="card">
      <h2><svg class="i"><use href="#plus"/></svg>เพิ่มรายการ</h2>
      <div class="seg"><button class="on in" id="tIn"><svg class="i"><use href="#up"/></svg>รายรับ</button><button class="ex" id="tEx"><svg class="i"><use href="#down"/></svg>รายจ่าย</button></div>
      <label>วันที่</label><input type="date" id="fDate">
      <label>หมวดหมู่</label><div class="chips" id="chips"></div>
      <label>จำนวนเงิน (บาท)</label><input type="number" id="fAmt" inputmode="decimal" placeholder="0">
      <label>หมายเหตุ</label><input id="fNote" placeholder="ไม่บังคับ">
      <button class="save" id="saveBtn" style="background:var(--g)"><svg class="i"><use href="#plus"/></svg>บันทึกรายรับ</button>
    </div>
    <div class="card">
      <h2><svg class="i"><use href="#chart"/></svg>รายรับ-รายจ่ายรายวัน</h2>
      <div class="ch"><canvas id="cBar"></canvas></div>
    </div>
  </section>

  <section class="grid">
    <div class="card">
      <h2><svg class="i"><use href="#pie"/></svg>สัดส่วนรายจ่าย</h2>
      <div class="ch"><canvas id="cPie"></canvas></div>
    </div>
    <div class="card">
      <div class="bar"><h2 style="margin:0"><svg class="i"><use href="#list"/></svg>รายการทั้งหมด</h2>
        <select id="fMonth"></select></div>
      <div class="list" id="list"></div>
    </div>
  </section>
</main>

<dialog id="dlg">
  <h2><svg class="i"><use href="#cloud"/></svg>เชื่อมต่อ Google Sheet</h2>
  <p>วาง Web App URL จาก Google Apps Script (ดูขั้นตอนในไฟล์ Code.gs) หากเว้นว่าง ข้อมูลจะเก็บในเครื่องนี้เท่านั้น</p>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="row2"><button id="push">อัปโหลดข้อมูลในเครื่องขึ้น Sheet</button></div>
  <div class="row2"><button id="cancel">ปิด</button><button class="p" id="ok">บันทึก</button></div>
</dialog>

<script>
const CATS={in:[['Grab'],['Bolt'],['Lala move'],['Line man'],['Bonus/Tip'],['อื่นๆ']],
 ex:[['น้ำมัน','fuel'],['เสื้อ/อุปกรณ์','shirt'],['ค่าอาหาร','food'],['ซ่อมบำรุง','tool'],['รายจ่ายอื่นๆ','dot']]};
const COL=['#e5484d','#f59f00','#1f6feb','#8e5cf7','#8b9a92'];
let cat='',rows=[],type='in',url=localStorage.getItem('gs_url')||'',charts={};
const $=id=>document.getElementById(id), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>'฿'+Math.round(n).toLocaleString('th-TH');
const dt=d=>new Date(d+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});
const BR={'Grab':['#00b14f','<b class="lt">G</b>'],'Bolt':['#34d186','<svg class="i" style="fill:#fff;stroke:none"><use href="#bolt"/></svg>'],'Lala move':['#f16622','<b class="lt">L</b>'],'Line man':['#06c755','<b class="lt">LM</b>'],'Bonus/Tip':['#f59f00','<svg class="i"><use href="#gift"/></svg>'],'อื่นๆ':['#6b7a72','<svg class="i"><use href="#wallet"/></svg>']};
function badge(t,c){if(t==='in'){const b=BR[c]||BR['อื่นๆ'];return `<div class="ico" style="background:${b[0]};color:#fff">${b[1]}</div>`}
 return `<div class="ico ex"><svg class="i"><use href="#${icon(t,c)}"/></svg></div>`}
function chips(){$('chips').className='chips '+type;$('chips').innerHTML=CATS[type].map(c=>`<button type="button" class="chip${c[0]===cat?' on':''}" data-c="${c[0]}">${badge(type,c[0])}<span>${c[0]}</span></button>`).join('')}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;chips()}};
const icon=(t,c)=>{const f=CATS[t].find(x=>x[0]===c);return f?f[1]:'dot'};
const store=()=>localStorage.setItem('rows_v2',JSON.stringify(rows));
async function post(o){if(!url)return;try{await fetch(url,{method:'POST',body:JSON.stringify(o)});mark(true)}catch(e){mark(false)}}
function mark(ok){$('syncTxt').textContent=url?(ok?'เชื่อมต่อ Sheet แล้ว':'เชื่อมต่อไม่ได้'):'ตั้งค่า Sheet'}
async function load(){
  if(url){try{const r=await fetch(url);rows=(await r.json()).rows;rows.forEach(x=>{if(x.cat==='ค่าโดยสาร Grab')x.cat='Grab'});mark(true);render();return}catch(e){mark(false)}}
  localStorage.removeItem('rows');const s=localStorage.getItem('rows_v2');rows=s?JSON.parse(s):[];mark(false);if(!url)$('syncTxt').textContent='ตั้งค่า Sheet';render()}
function setType(t){type=t;$('tIn').className=(t==='in'?'on ':'')+'in';$('tEx').className=(t==='ex'?'on ':'')+'ex';
  cat=CATS[t][0][0];chips();
  const b=$('saveBtn');b.style.background=t==='in'?'var(--g)':'var(--r)';b.lastChild.textContent=t==='in'?'บันทึกรายรับ':'บันทึกรายจ่าย'}
function view(){const m=$('fMonth').value;return rows.filter(r=>!m||r.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date))}
function render(){
  const ms=[...new Set(rows.map(r=>r.date.slice(0,7)))].sort().reverse(),cur=$('fMonth').value;
  $('fMonth').innerHTML='<option value="">ทุกเดือน</option>'+ms.map(m=>`<option value="${m}">${new Date(m+'-01').toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</option>`).join('');
  $('fMonth').value=ms.includes(cur)?cur:'';
  const v=view(),sum=t=>v.filter(r=>r.type===t).reduce((a,r)=>a+r.amount,0),I=sum('in'),E=sum('ex'),days=new Set(v.map(r=>r.date)).size;
  $('sIn').textContent=fmt(I);$('sEx').textContent=fmt(E);$('sNet').textContent=fmt(I-E);$('sAvg').textContent=fmt(days?(I-E)/days:0);
  $('list').innerHTML=v.length?v.map(r=>`<div class="row">${badge(r.type,r.cat)}
   <div class="t"><div>${r.cat}</div><small>${dt(r.date)}${r.note?' · '+r.note:''}</small></div>
   <div class="a ${r.type}">${r.type==='in'?'+':'−'}${fmt(r.amount)}</div>
   <button class="del" data-id="${r.id}" aria-label="ลบ"><svg class="i"><use href="#trash"/></svg></button></div>`).join(''):'<div class="empty">ยังไม่มีรายการ</div>';
  const ds=[...new Set(v.map(r=>r.date))].sort(),g=(d,t)=>v.filter(r=>r.date===d&&r.type===t).reduce((a,r)=>a+r.amount,0);
  draw('cBar',{type:'bar',data:{labels:ds.map(dt),datasets:[{label:'รายรับ',data:ds.map(d=>g(d,'in')),backgroundColor:'#00a84a',borderRadius:6},{label:'รายจ่าย',data:ds.map(d=>g(d,'ex')),backgroundColor:'#e5484d',borderRadius:6}]},options:{scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}});
  const ex=CATS.ex.map(c=>[c[0],v.filter(r=>r.type==='ex'&&r.cat===c[0]).reduce((a,r)=>a+r.amount,0)]).filter(x=>x[1]);
  draw('cPie',{type:'doughnut',data:{labels:ex.map(x=>x[0]),datasets:[{data:ex.map(x=>x[1]),backgroundColor:COL,borderWidth:0}]},options:{cutout:'65%'}})}
function draw(id,cfg){if(charts[id])charts[id].destroy();cfg.options.maintainAspectRatio=false;cfg.options.plugins={legend:{position:'bottom',labels:{usePointStyle:true,font:{family:'Prompt'}}}};
  Chart.defaults.color=getComputedStyle(document.body).getPropertyValue('--mute');charts[id]=new Chart($(id),cfg)}
$('tIn').onclick=()=>setType('in');$('tEx').onclick=()=>setType('ex');
$('saveBtn').onclick=()=>{const a=parseFloat($('fAmt').value);if(!a||a<=0||!$('fDate').value){$('fAmt').focus();return}
  const row={id:uid(),date:$('fDate').value,type,cat,amount:a,note:$('fNote').value.trim()};
  rows.push(row);store();post({action:'add',row});$('fAmt').value='';$('fNote').value='';render()};
$('list').onclick=e=>{const b=e.target.closest('.del');if(!b||!confirm('ลบรายการนี้?'))return;
  rows=rows.filter(r=>r.id!==b.dataset.id);store();post({action:'delete',id:b.dataset.id});render()};
$('fMonth').onchange=render;
$('syncBtn').onclick=()=>{$('url').value=url;$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('ok').onclick=()=>{url=$('url').value.trim();localStorage.setItem('gs_url',url);$('dlg').close();load()};
$('push').onclick=async()=>{if(!$('url').value.trim())return alert('วาง URL ก่อน');url=$('url').value.trim();localStorage.setItem('gs_url',url);
  if(confirm('ส่งข้อมูลในเครื่อง '+rows.length+' รายการขึ้น Sheet?')){await post({action:'bulk',rows});alert('ส่งแล้ว')}};
$('fDate').value=new Date().toISOString().slice(0,10);setType('in');load();
</script>
</body>
</html>
